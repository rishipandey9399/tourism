<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Investor Profile · MP Tourism Investment Portal</title>

  <!--
    THEME (runs before anything is drawn, so the page never flashes the wrong theme)
    "light" (peach / saffron, default) or "dark" (ivory / black / gold):
      1. a ?theme= value in the address (passed on by the login page), else
      2. the visitor's last choice, saved in this browser.
  -->
  <script>
    (function () {
      var theme = new URLSearchParams(location.search).get("theme");
      try {
        if (theme) {
          localStorage.setItem("mpTheme", theme);
        } else {
          theme = localStorage.getItem("mpTheme");
        }
      } catch (error) {
        /* storage blocked (private mode): just use the default */
      }
      document.documentElement.dataset.theme = theme === "dark" ? "dark" : "light";
    })();
  </script>

  <!-- Compiled Tailwind styles (source: styles/input.css – run "npm run build:dashboard") -->
  <link rel="stylesheet" href="styles/dashboard.css">
</head>

<body class="page-glow min-h-svh">

  <!-- =====================================================================
       SVG ICON SPRITE – reused via <use href="#icon-…">
       ===================================================================== -->
  <svg class="absolute size-0" aria-hidden="true">
    <defs>
      <symbol id="icon-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></symbol>
      <symbol id="icon-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.5"/></symbol>
      <symbol id="icon-id-card" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2.5"/><path d="M5.5 16.5a4 4 0 0 1 7 0M15 9h3M15 13h3"/></symbol>
      <symbol id="icon-mountain" viewBox="0 0 24 24"><path d="m3 20 6.5-11 4 6.5L16 12l5 8z"/><path d="m7.5 12.5 2-1.5 2 1.5"/></symbol>
      <symbol id="icon-map-pin" viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></symbol>
      <symbol id="icon-chevron-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
      <symbol id="icon-chevron-right" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
      <symbol id="icon-chevron-left" viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></symbol>
      <symbol id="icon-logout" viewBox="0 0 24 24"><path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"/><path d="M10 16l-4-4 4-4M6 12h10"/></symbol>
      <symbol id="icon-bar-chart" viewBox="0 0 24 24"><path d="M5 20v-6M12 20V8M19 20V4"/></symbol>
      <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
      <symbol id="icon-profile-check" viewBox="0 0 24 24"><rect x="3" y="3" width="15" height="15" rx="2"/><circle cx="10.5" cy="9" r="2.5"/><path d="M6.5 15a4 4 0 0 1 8 0"/><circle cx="18" cy="18" r="3.5"/><path d="m16.5 18 1 1 2-2"/></symbol>
      <symbol id="icon-check-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></symbol>
      <symbol id="icon-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
      <symbol id="icon-warning" viewBox="0 0 24 24"><path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17h.01"/></symbol>
      <symbol id="icon-file" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/></symbol>
      <symbol id="icon-layers" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5z"/><path d="m3 12 9 5 9-5M3 16l9 5 9-5"/></symbol>
      <symbol id="icon-rupee" viewBox="0 0 24 24"><path d="M7 5h10M7 9h10M10 5c3 0 5 1.5 5 4s-2 4-5 4H7l7 7"/></symbol>
      <symbol id="icon-bolt" viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></symbol>
      <symbol id="icon-plus-square" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M12 8v8M8 12h8"/></symbol>
      <symbol id="icon-edit" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></symbol>
      <symbol id="icon-download" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 20h16"/></symbol>
      <symbol id="icon-dots" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/></symbol>
      <symbol id="icon-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
      <symbol id="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></symbol>
      <symbol id="icon-moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></symbol>
      <symbol id="icon-eye" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>

      <!-- Profile type icons -->
      <symbol id="icon-tender" viewBox="0 0 32 32"><path d="M11 5H8a2 2 0 0 0-2 2v20a2 2 0 0 0 2 2h8"/><path d="M21 5h3a2 2 0 0 1 2 2v7"/><rect x="11" y="3" width="10" height="5" rx="1.5"/><path d="M10 14h10M10 19h6"/><path d="m19.5 21.5 5-5 3 3-5 5z"/><path d="m21 23-4.5 4.5"/><path d="M25 26h5"/></symbol>
      <symbol id="icon-invest" viewBox="0 0 32 32"><ellipse cx="16" cy="18" rx="8" ry="2.8"/><path d="M8 18v4c0 1.5 3.6 2.8 8 2.8s8-1.3 8-2.8v-4"/><path d="M8 22v4c0 1.5 3.6 2.8 8 2.8s8-1.3 8-2.8v-4"/><path d="M16 15V8"/><path d="M16 10c0-3.2 2.2-5.4 6.5-5.4 0 3.2-2.2 5.4-6.5 5.4zM16 11c0-2.7-1.9-4.6-5.5-4.6 0 2.7 1.9 4.6 5.5 4.6z"/></symbol>
      <symbol id="icon-arrow-right" viewBox="0 0 24 24"><path d="M4 12h16m-6-6 6 6-6 6"/></symbol>
    </defs>
  </svg>


  <!-- =====================================================================
       SIDEBAR
       Fixed on desktop; slides in from the left on smaller screens
       (opened by the menu button in the header).
       ===================================================================== -->
  <aside class="sidebar fixed inset-y-0 left-0 z-40 flex w-[275px] flex-col overflow-hidden rounded-r-[28px] text-side-ink shadow-[8px_0_40px_rgb(107_42_18/.25)] lg:rounded-r-[28px]" id="sidebar" aria-label="Sidebar">

    <!-- Logo + portal name -->
    <a class="flex items-center gap-3 px-6 pt-6 pb-5" href="index.html">
      <img class="h-[64px] w-auto" src="../assets/img/brand/logo-white.png" alt="MP Tourism">
      <span class="font-serif text-[17px] font-bold leading-tight">MP Tourism<br>Investment Portal</span>
    </a>

    <div class="mx-6 mb-6 border-t border-side-ink/25"></div>

    <!-- Navigation -->
    <nav class="flex flex-1 flex-col gap-1.5 overflow-y-auto px-3.5" aria-label="Dashboard">
      <a class="flex items-center gap-4 rounded-2xl px-4 py-3 text-[17px] transition-colors hover:bg-white/10" href="index.html">
        <svg class="icon size-6"><use href="#icon-grid"/></svg>
        Dashboard
      </a>

      <!-- Current page -->
      <a class="flex items-center gap-4 rounded-2xl bg-side-active px-4 py-3 text-[17px] font-bold text-side-active-ink shadow-[0_8px_20px_rgb(0_0_0/.15)]" href="profile.html" aria-current="page">
        <svg class="icon size-6"><use href="#icon-id-card"/></svg>
        Investor Profile
      </a>

      <a class="flex items-center gap-4 rounded-2xl px-4 py-3 text-[17px] transition-colors hover:bg-white/10" href="#">
        <svg class="icon size-6"><use href="#icon-mountain"/></svg>
        Tourism Projects
      </a>

      <!-- Expandable group -->
      <button type="button" class="flex w-full items-center gap-4 rounded-2xl px-4 py-3 text-left text-[17px] transition-colors hover:bg-white/10" id="itt-toggle" aria-expanded="false" aria-controls="itt-submenu">
        <svg class="icon size-6"><use href="#icon-map-pin"/></svg>
        <span class="flex-1">ITT for Identified Land</span>
        <svg class="icon submenu-chevron size-5 transition-transform"><use href="#icon-chevron-down"/></svg>
      </button>
      <div class="submenu" id="itt-submenu">
        <div class="flex flex-col gap-1 pl-14">
          <a class="rounded-xl px-3 py-2 text-[15px] text-side-ink/85 hover:bg-white/10 hover:text-side-ink" href="#">Browse land bank</a>
          <a class="rounded-xl px-3 py-2 text-[15px] text-side-ink/85 hover:bg-white/10 hover:text-side-ink" href="#">Submit intention</a>
          <a class="rounded-xl px-3 py-2 text-[15px] text-side-ink/85 hover:bg-white/10 hover:text-side-ink" href="#">My ITT applications</a>
        </div>
      </div>
    </nav>

    <!-- Logout -->
    <div class="mx-6 mt-4 border-t border-side-ink/25"></div>
    <a class="mx-3.5 mt-3 flex items-center gap-4 rounded-2xl px-4 py-3 text-[17px] transition-colors hover:bg-white/10" href="../login/index.html" id="logout-link">
      <svg class="icon size-6"><use href="#icon-logout"/></svg>
      Logout
    </a>

  </aside>

  <!-- Dark backdrop behind the open sidebar on small screens -->
  <div class="fixed inset-0 z-30 hidden bg-black/40 lg:hidden" id="sidebar-backdrop" aria-hidden="true"></div>


  <!-- =====================================================================
       MAIN CONTENT
       ===================================================================== -->
  <div class="relative min-h-svh overflow-hidden lg:pl-[275px]">

    <!-- Soft hills along the bottom of the page -->
    <svg class="hills-art pointer-events-none absolute inset-x-0 bottom-0 h-[90px] w-full lg:left-[275px]" viewBox="0 0 1200 90" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 70C120 40 200 40 300 60s200 10 300-20 220-20 300 10 220 30 300 0V90H0z" fill="currentColor" opacity=".55"/>
      <path d="M0 80c140-20 260-10 380 0s250 0 380-15 280 0 440 10V90H0z" fill="currentColor"/>
    </svg>

    <main class="relative mx-auto max-w-[1400px] px-4 pt-5 pb-28 sm:px-6 lg:px-7 lg:pt-7">

      <!-- ===============================================================
           HEADER: title, search, notifications, account
           =============================================================== -->
      <header class="flex flex-wrap items-center gap-4 xl:flex-nowrap">

        <!-- Menu button (opens the sidebar on small screens) -->
        <button type="button" class="grid size-11 place-items-center rounded-xl border border-line bg-surface text-primary lg:hidden" id="sidebar-open" aria-label="Open menu" aria-controls="sidebar" aria-expanded="false">
          <svg class="icon size-6"><use href="#icon-menu"/></svg>
        </button>

        <!-- Title (own row on phones) -->
        <div class="flex min-w-0 flex-1 items-center gap-4 max-sm:order-1 max-sm:basis-full">
          <div class="hidden size-[58px] flex-none place-items-center rounded-2xl bg-soft text-accent sm:grid">
            <svg class="icon size-8"><use href="#icon-id-card"/></svg>
          </div>
          <div class="min-w-0">
            <h1 class="font-serif text-[26px] font-bold leading-tight sm:text-[38px]">Investor Profile</h1>
          </div>
        </div>

        <!-- Search -->
        <label class="order-last flex h-11 w-full items-center gap-3 rounded-full border border-line bg-surface px-4 text-muted xl:order-none xl:w-[290px]">
          <svg class="icon size-5"><use href="#icon-search"/></svg>
          <input class="min-w-0 flex-1 bg-transparent text-[15px] text-ink outline-none placeholder:text-muted" type="search" placeholder="Search projects, applications..." aria-label="Search projects and applications">
        </label>

        <div class="hidden h-10 border-l border-line xl:block"></div>

        <!-- Theme switch -->
        <button type="button" class="grid size-11 place-items-center rounded-full text-ink hover:bg-soft max-sm:ml-auto" id="theme-toggle" title="Switch theme" aria-label="Switch theme">
          <svg class="icon size-6 dark:hidden"><use href="#icon-sun"/></svg>
          <svg class="icon hidden size-6 dark:block"><use href="#icon-moon"/></svg>
        </button>

        <div class="hidden h-10 border-l border-line xl:block"></div>

        <!-- Account -->
        <button type="button" class="flex items-center gap-3 rounded-full py-1 pl-1 pr-2 hover:bg-soft" aria-label="Account menu">
          <span class="grid size-12 place-items-center rounded-full bg-accent text-lg font-bold text-white dark:bg-primary dark:text-[#E9CC8E]" id="user-initials">RP</span>
          <span class="hidden text-left sm:block">
            <b class="block text-[17px]" id="user-name">Rishi Pandey</b>
            <span class="text-[14px] text-muted">Investor</span>
          </span>
          <svg class="icon hidden size-5 sm:block"><use href="#icon-chevron-down"/></svg>
        </button>
      </header>


      <!-- ===============================================================
           SELECT PROFILE TYPE
           Two selectable cards (real radio buttons, styled with Tailwind's
           has-checked: variant), then Continue. See scripts/profile.js.
           =============================================================== -->
      <section class="mt-7 rounded-[22px] border border-line bg-surface p-5 shadow-[0_8px_24px_rgb(169_54_18/.05)] sm:p-8" aria-labelledby="profile-type-title">

        <h2 class="font-serif text-[24px] font-bold leading-tight sm:text-[30px]" id="profile-type-title">Select your Profile Type</h2>
        <p class="mt-2 text-[16px] text-muted sm:text-[18px]">Choose the application track you wish to proceed with.</p>

        <form class="mt-6 sm:mt-8" id="profile-type-form">
          <fieldset class="grid gap-5 md:grid-cols-2">
            <legend class="sr-only">Profile type</legend>

            <!-- Option 1: tender based (under ₹100 Cr) -->
            <label class="group relative flex cursor-pointer gap-5 rounded-[22px] border-2 border-line bg-page/60 p-5 transition-all hover:border-accent hover:shadow-[0_12px_28px_rgb(169_54_18/.08)] has-checked:border-primary has-checked:bg-soft/50 has-checked:shadow-[0_14px_32px_rgb(169_54_18/.12)] has-focus-visible:outline-3 has-focus-visible:outline-accent sm:p-7">
              <input class="sr-only" type="radio" name="profile-type" value="tender" required>

              <span class="grid size-16 flex-none place-items-center rounded-2xl bg-soft text-primary transition-colors group-has-checked:bg-primary group-has-checked:text-white sm:size-[76px] dark:group-has-checked:text-[#E9CC8E]">
                <svg class="icon size-9 sm:size-11"><use href="#icon-tender"/></svg>
              </span>

              <span class="min-w-0 pr-8">
                <b class="block text-[19px] leading-snug sm:text-[22px]">Tender Based Application</b>
                <span class="mt-1 block text-[16px] font-semibold text-accent sm:text-[18px]">Investment less than ₹100 Cr</span>
                <span class="mt-2 block text-[15px] text-muted sm:text-[16px]">Participate in tendered tourism land parcels and raise your intention to invest.</span>
              </span>

              <!-- Radio indicator (top right) -->
              <span class="absolute right-5 top-5 grid size-6 place-items-center rounded-full border-2 border-line transition-colors group-has-checked:border-primary" aria-hidden="true">
                <span class="size-3 scale-0 rounded-full bg-primary transition-transform group-has-checked:scale-100"></span>
              </span>
            </label>

            <!-- Option 2: direct investment (over ₹100 Cr) -->
            <label class="group relative flex cursor-pointer gap-5 rounded-[22px] border-2 border-line bg-page/60 p-5 transition-all hover:border-accent hover:shadow-[0_12px_28px_rgb(169_54_18/.08)] has-checked:border-primary has-checked:bg-soft/50 has-checked:shadow-[0_14px_32px_rgb(169_54_18/.12)] has-focus-visible:outline-3 has-focus-visible:outline-accent sm:p-7">
              <input class="sr-only" type="radio" name="profile-type" value="direct">

              <span class="grid size-16 flex-none place-items-center rounded-2xl bg-soft text-primary transition-colors group-has-checked:bg-primary group-has-checked:text-white sm:size-[76px] dark:group-has-checked:text-[#E9CC8E]">
                <svg class="icon size-9 sm:size-11"><use href="#icon-invest"/></svg>
              </span>

              <span class="min-w-0 pr-8">
                <b class="block text-[19px] leading-snug sm:text-[22px]">Direct Investment Application</b>
                <span class="mt-1 block text-[16px] font-semibold text-accent sm:text-[18px]">Investment greater than ₹100 Cr</span>
                <span class="mt-2 block text-[15px] text-muted sm:text-[16px]">Complete enterprise profiling and file the Annexure-I application directly.</span>
              </span>

              <span class="absolute right-5 top-5 grid size-6 place-items-center rounded-full border-2 border-line transition-colors group-has-checked:border-primary" aria-hidden="true">
                <span class="size-3 scale-0 rounded-full bg-primary transition-transform group-has-checked:scale-100"></span>
              </span>
            </label>
          </fieldset>

          <!-- Continue (enabled once a track is chosen) -->
          <button type="submit" class="mt-6 ml-auto flex h-14 w-full items-center justify-center gap-3 rounded-2xl sm:w-[300px] bg-linear-110 from-primary to-primary-dark text-[19px] font-bold text-[#fff9f0] shadow-[0_10px_24px_rgb(169_54_18/.25)] transition-opacity hover:opacity-95 disabled:cursor-not-allowed disabled:opacity-50 dark:bg-none dark:bg-black dark:text-[#E9CC8E] sm:mt-8 sm:h-[60px] sm:text-[20px]" id="profile-continue" disabled>
            Continue
            <svg class="icon size-6"><use href="#icon-arrow-right"/></svg>
          </button>

          <!-- Result message (hidden while empty) -->
          <p class="mt-4 text-right text-[15px] font-semibold text-primary empty:hidden" id="profile-status" role="status"></p>
        </form>
      </section>
    </main>
  </div>


  <!-- Shared dashboard behaviour (theme, sidebar), then this page -->
  <script src="scripts/dashboard.js"></script>
  <script src="scripts/profile.js"></script>
</body>
</html>
